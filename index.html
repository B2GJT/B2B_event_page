<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데이원 아카이브 이벤트</title>
<style>
  :root {
    --bg: #f0f1f3;
    --text-main: #1a1a1a;
    --text-sub: #8a8f98;
    --accent: #4f5cff;
    --card-radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
    color: var(--text-main);
    padding: 0 24px 100px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  /* ===== 히어로 헤더 ===== */
  .hero {
    position: relative;
    margin: 0 -24px 40px;
    padding: 64px 24px 56px;
    background: linear-gradient(135deg, #4f5cff 0%, #6d5bff 45%, #a855f7 100%);
    overflow: hidden;
    text-align: center;
  }
  .hero-inner { position: relative; z-index: 3; }
  .hero-eyebrow {
    display: inline-block;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 18px;
  }
  .hero h1 {
    margin: 0 0 12px;
    font-size: 34px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .hero h1 span {
    display: inline-block;
    animation: bounce 1.8s ease-in-out infinite;
  }
  .hero p {
    margin: 0;
    font-size: 15px;
    color: rgba(255,255,255,0.88);
    font-weight: 500;
  }
  .hero p strong { color: #ffe066; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(-8deg); }
  }

  /* 스파크 장식 */
  .confetti {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .spark {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    opacity: 0;
    z-index: 2;
    animation: burst 2.6s ease-out infinite;
  }
  @keyframes burst {
    0%   { transform: scale(0); opacity: 0; }
    15%  { transform: scale(1); opacity: 1; }
    60%  { transform: scale(1.4); opacity: 0.4; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  /* 탭 */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 36px;
    border-bottom: 1px solid #dcdde1;
    padding-bottom: 0;
  }
  .tab-btn {
    position: relative;
    padding: 12px 4px;
    margin-right: 22px;
    border: none;
    background: none;
    color: var(--text-sub);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .tab-btn::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--text-main);
    opacity: 0;
    transform: scaleX(0.6);
    transition: opacity .15s, transform .15s;
  }
  .tab-btn.active { color: var(--text-main); }
  .tab-btn.active::after { opacity: 1; transform: scaleX(1); }

  /* 섹션 */
  .event-section { display: none; }
  .event-section.active {
    display: block;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 카드 그리드 (진행중/종료 공통 2열) */
  .event-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  @media (max-width: 640px) {
    .event-grid { grid-template-columns: 1fr; }
  }

  .event-card {
    display: block;
    text-decoration: none;
    color: inherit;
    transition: transform .18s ease;
  }
  .event-card:hover { transform: translateY(-4px); }
  .event-banner {
    width: 100%;
    aspect-ratio: 16 / 8.5;
    border-radius: var(--card-radius);
    background-size: cover;
    background-position: center;
    background-color: #111;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    transition: box-shadow .18s ease;
  }
  .event-card:hover .event-banner {
    box-shadow: 0 10px 22px rgba(0,0,0,0.16);
  }
  .event-card.ended .event-banner { filter: grayscale(70%) brightness(0.75); }
  .event-card.ended:hover { transform: none; }
  .event-title { margin: 14px 2px 4px; font-size: 17px; font-weight: 700; }
  .event-date { margin: 0 2px; font-size: 13px; color: var(--text-sub); }

  /* 종료 도장 */
  .stamp {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-12deg);
    border: 3px solid #ff4d4f;
    color: #ff4d4f;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 8px 16px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    z-index: 2;
    white-space: nowrap;
  }
  .stamp::before {
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid #ff4d4f;
    border-radius: 5px;
  }

  /* 빈 상태 */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 0;
    color: var(--text-sub);
    font-size: 14px;
  }
  .loading-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 0;
    color: var(--text-sub);
    font-size: 14px;
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="confetti">
      <span class="spark" style="width:8px; height:8px; left:20%; top:20%; animation-delay:.3s;"></span>
      <span class="spark" style="width:10px; height:10px; left:75%; top:15%; animation-delay:1.1s;"></span>
      <span class="spark" style="width:6px; height:6px; left:50%; top:35%; animation-delay:.8s;"></span>
      <span class="spark" style="width:9px; height:9px; left:88%; top:40%; animation-delay:1.6s;"></span>
      <span class="spark" style="width:7px; height:7px; left:10%; top:45%; animation-delay:2s;"></span>
    </div>
    <div class="hero-inner">
      <span class="hero-eyebrow">🔥 EVENT PAGE</span>
      <h1><span>🎉</span> 데이원아카이브 이벤트 <span>🎉</span></h1>
      <p>지금 <strong>참여하고 쏟아지는 선물의</strong>주인공이 되세요!</p>
    </div>
  </div>

<div class="wrap">

  <div class="tabs">
    <button class="tab-btn active" data-target="ongoing">진행중인 이벤트</button>
    <button class="tab-btn" data-target="ended">종료된 이벤트</button>
  </div>

  <section id="ongoing" class="event-section active">
    <div class="event-grid" id="ongoingGrid">
      <div class="loading-state">불러오는 중...</div>
    </div>
  </section>

  <section id="ended" class="event-section">
    <div class="event-grid" id="endedGrid">
      <div class="loading-state">불러오는 중...</div>
    </div>
  </section>

</div>

<script>
  /*
    ===== 구글 시트 연동 설정 =====
    1. 구글 시트 헤더: title, date, end_date, image, link
       - date: 화면에 보여줄 기간 텍스트 (예: 2026.09.01~2026.10.31)
       - end_date: 자동 종료 판단용 실제 종료일, 반드시 YYYY-MM-DD 형식 (예: 2026-10-31)
    2. 시트 공유 설정에서 "링크가 있는 모든 사용자 - 뷰어"로 되어 있어야 함
       (공유 버튼 > 일반 액세스 > "링크가 있는 모든 사용자"로 변경)
    → end_date가 오늘 지나면 자동으로 종료된 이벤트로 넘어감
  */
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1vCC0rmlqnjA5VUyXKZ1ppfquK9moodNJCEKmpbi-ypc/gviz/tq?tqx=out:csv&gid=0";

  // 쉼표 안에 따옴표로 감싼 값이 있어도 안전하게 나누는 간단 CSV 파서
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(field); field = '';
          if (row.some(v => v !== '')) rows.push(row);
          row = [];
        } else field += c;
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function rowsToEvents(rows) {
    const header = rows[0].map(h => h.trim().toLowerCase());
    const idx = k => header.indexOf(k);
    return rows.slice(1)
      .filter(r => r.length > 1 && r[idx('title')])
      .map(r => ({
        title: r[idx('title')] || '',
        date: r[idx('date')] || '',
        endDate: (r[idx('end_date')] || '').trim(),
        image: r[idx('image')] || '',
        link: r[idx('link')] || '#'
      }));
  }

  // end_date를 다양한 표기(2026-10-31 / 2026.10.31 / 2026/10/31)로 적어도 인식
  function parseFlexibleDate(str) {
    if (!str) return null;
    const cleaned = str.trim().replace(/[./]/g, '-').replace(/\s+/g, '').replace(/-+$/, '');
    const parts = cleaned.split('-').filter(Boolean).map(p => parseInt(p, 10));
    if (parts.length !== 3 || parts.some(isNaN)) return null;
    let [a, b, c] = parts;
    let y, m, d;
    if (a > 31) { y = a; m = b; d = c; }       // YYYY-MM-DD
    else if (c > 31) { y = c; m = a; d = b; }  // MM-DD-YYYY
    else return null;
    return new Date(y, m - 1, d, 23, 59, 59);
  }

  function isEventEnded(event) {
    const end = parseFlexibleDate(event.endDate);
    if (!end) return false;
    return end.getTime() < Date.now();
  }

  function renderCard(event, isEnded) {
    const stamp = isEnded ? '<span class="stamp">종료된 이벤트입니다</span>' : '';
    return `
      <a class="event-card${isEnded ? ' ended' : ''}" href="${event.link}">
        <div class="event-banner" style="background-image:url('${event.image}');">${stamp}</div>
        <p class="event-title">${event.title}</p>
        <p class="event-date">${event.date}</p>
      </a>`;
  }

  function renderList(containerId, list, isEnded) {
    const el = document.getElementById(containerId);
    if (!list || list.length === 0) {
      el.innerHTML = `<div class="empty-state">표시할 이벤트가 없습니다</div>`;
      return;
    }
    el.innerHTML = list.map(e => renderCard(e, isEnded)).join('');
  }

  fetch(SHEET_CSV_URL)
    .then(res => res.text())
    .then(text => {
      const events = rowsToEvents(parseCSV(text));
      renderList('ongoingGrid', events.filter(e => !isEventEnded(e)), false);
      renderList('endedGrid', events.filter(e => isEventEnded(e)), true);
    })
    .catch(err => {
      console.error('시트 로딩 실패:', err);
      document.getElementById('ongoingGrid').innerHTML =
        `<div class="empty-state">시트를 불러오지 못했습니다. 시트 공유 설정(링크가 있는 모든 사용자)을 확인해주세요.</div>`;
      document.getElementById('endedGrid').innerHTML = '';
    });

  // 탭 전환
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.event-section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.target).classList.add('active');
    });
  });
</script>
</body>
</html>
