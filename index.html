<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데이원아카이브 이벤트</title>
<style>
  :root {
    --bg: #f0f1f3;
    --text-main: #1a1a1a;
    --text-sub: #8a8f98;
    --accent: #4f5cff;
    --card-radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
    color: var(--text-main);
    padding: 0 24px 100px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  /* ===== 히어로 헤더 ===== */
  .hero {
    position: relative;
    margin: 0 -24px 40px;
    padding: 64px 24px 56px;
    background: linear-gradient(135deg, #4f5cff 0%, #6d5bff 45%, #a855f7 100%);
    overflow: hidden;
    text-align: center;
  }
  .hero-inner { position: relative; z-index: 3; }
  .hero-eyebrow {
    display: inline-block;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 18px;
  }
  .hero h1 {
    margin: 0 0 12px;
    font-size: 34px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .hero h1 span {
    display: inline-block;
    animation: bounce 1.8s ease-in-out infinite;
  }
  .hero p {
    margin: 0;
    font-size: 15px;
    color: rgba(255,255,255,0.88);
    font-weight: 500;
  }
  .hero p strong {
    color: #ffe066;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(-8deg); }
  }

  /* 스파크 장식 */
  .spark {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    opacity: 0;
    z-index: 2;
    animation: burst 2.6s ease-out infinite;
  }
  @keyframes burst {
    0%   { transform: scale(0); opacity: 0; }
    15%  { transform: scale(1); opacity: 1; }
    60%  { transform: scale(1.4); opacity: 0.4; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  /* 탭 */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 36px;
    border-bottom: 1px solid #dcdde1;
    padding-bottom: 0;
  }
  .tab-btn {
    position: relative;
    padding: 12px 4px;
    margin-right: 22px;
    border: none;
    background: none;
    color: var(--text-sub);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .tab-btn::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--text-main);
    opacity: 0;
    transform: scaleX(0.6);
    transition: opacity .15s, transform .15s;
  }
  .tab-btn.active { color: var(--text-main); }
  .tab-btn.active::after { opacity: 1; transform: scaleX(1); }

  /* 섹션 */
  .section-title {
    font-size: 20px;
    font-weight: 800;
    margin: 0 0 18px;
  }
  .event-section { display: none; }
  .event-section.active {
    display: block;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 진행중 이벤트 - 종료 이벤트와 동일한 2열 그리드 */
  .ongoing-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  .ongoing-grid .event-banner {
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }

  /* 배너 그리드 (종료 이벤트 등 2열) */
  .event-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  @media (max-width: 640px) {
    .event-grid, .ongoing-grid { grid-template-columns: 1fr; }
  }

  .event-card {
    display: block;
    text-decoration: none;
    color: inherit;
    transition: transform .18s ease;
  }
  .event-card:hover { transform: translateY(-4px); }
  .event-banner {
    width: 100%;
    aspect-ratio: 16 / 8.5;
    border-radius: var(--card-radius);
    background-size: cover;
    background-position: center;
    background-color: #111; /* 이미지 로딩 전/실패 시 배경 */
    overflow: hidden;
    position: relative;
    transition: box-shadow .18s ease;
  }
  .event-card:hover .event-banner {
    box-shadow: 0 10px 22px rgba(0,0,0,0.16);
  }
  .event-card.ended .event-banner {
    filter: grayscale(70%) brightness(0.75);
  }
  .event-card.ended:hover { transform: none; }

  /* 종료 도장 */
  .stamp {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-12deg);
    border: 3px solid #ff4d4f;
    color: #ff4d4f;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 8px 16px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    z-index: 2;
    white-space: nowrap;
  }
  .stamp::before {
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid #ff4d4f;
    border-radius: 5px;
  }
  .event-title {
    margin: 14px 2px 4px;
    font-size: 17px;
    font-weight: 700;
  }
  .event-date {
    margin: 0 2px;
    font-size: 13px;
    color: var(--text-sub);
  }

  /* 빈 상태 */
  .empty-state {
    text-align: center;
    padding: 60px 0;
    color: var(--text-sub);
    font-size: 14px;
  }
</style>
</head>
<body>

  <!-- ===== 히어로 헤더 ===== -->
  <div class="hero">
    <div class="confetti">
      <span class="spark" style="width:8px; height:8px; left:20%; top:20%; animation-delay:.3s;"></span>
      <span class="spark" style="width:10px; height:10px; left:75%; top:15%; animation-delay:1.1s;"></span>
      <span class="spark" style="width:6px; height:6px; left:50%; top:35%; animation-delay:.8s;"></span>
      <span class="spark" style="width:9px; height:9px; left:88%; top:40%; animation-delay:1.6s;"></span>
      <span class="spark" style="width:7px; height:7px; left:10%; top:45%; animation-delay:2s;"></span>
    </div>
    <div class="hero-inner">
      <span class="hero-eyebrow">🔥 EVENT PAGE</span>
      <h1><span>🎉</span> 데이원아카이브 이벤트 <span>🎉</span></h1>
      <p>지금 <strong>참여하고 혜택</strong>을 받아가세요!</p>
    </div>
  </div>

<div class="wrap">

  <div class="tabs">
    <button class="tab-btn active" data-target="ongoing">진행중인 이벤트</button>
    <button class="tab-btn" data-target="ended">종료된 이벤트</button>
  </div>

  <!-- 진행중인 이벤트 -->
  <section id="ongoing" class="event-section active">
    <div class="ongoing-grid">

      <a class="event-card" href="./events/sample-ongoing-1.html">
        <div class="event-banner" style="background-image:url('./images/banner-ongoing-1.png');"></div>
        <p class="event-title">빙고판에 맞춰 만드는 나만의 커리큘럼</p>
        <p class="event-date">2026.09.01~2026.10.31</p>
      </a>

      <a class="event-card" href="./events/sample-ongoing-2.html">
        <div class="event-banner" style="background-image:url('./images/banner-ongoing-2.png');"></div>
        <p class="event-title">설문조사 참여하고 커피쿠폰 받자!</p>
        <p class="event-date">2026.09.10~2026.11.30</p>
      </a>

      <!-- 진행중 이벤트 없을 때는 위 <a> 블록 지우고 아래 한 줄만 남기기 -->
      <!-- <div class="empty-state">현재 진행중인 이벤트가 없습니다</div> -->

    </div>
  </section>

  <!-- 종료된 이벤트 -->
  <section id="ended" class="event-section">
    <div class="event-grid">

      <a class="event-card ended" href="./events/2024-jobprep.html">
        <div class="event-banner" style="background-image:url('./images/banner-jobprep.jpg');">
          <span class="stamp">종료된 이벤트입니다</span>
        </div>
        <p class="event-title">내일은 원래 무료다</p>
        <p class="event-date">2024.04.25~2024.07.24</p>
      </a>

      <a class="event-card ended" href="./events/2024-ai-starter.html">
        <div class="event-banner" style="background-image:url('./images/banner-ai-starter.jpg');">
          <span class="stamp">종료된 이벤트입니다</span>
        </div>
        <p class="event-title">AI 스타터패키지</p>
        <p class="event-date">2024.06.25~2024.06.27</p>
      </a>

      <!-- 카드 하나 = <a class="event-card ended"> 통째로 복사해서 이미지/제목/날짜/링크만 교체 -->

    </div>
  </section>

</div>

<script>
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.event-section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.target).classList.add('active');
    });
  });
</script>
</body>
</html>
